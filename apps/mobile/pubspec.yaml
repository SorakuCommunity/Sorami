name: Sorami
description: Sorami Anime Streaming App by Soraku Studio
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.0
  go_router: ^12.0.0
  better_player_plus: ^1.2.0
  dio: ^5.0.0
  hive_flutter: ^1.1.0
  cached_network_image: ^3.2.0
  firebase_core: ^2.0.0
  firebase_messaging: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/logos/